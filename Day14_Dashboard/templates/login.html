<!DOCTYPE html>
<html>
<head>
    <title>NOC Login</title>
    <style>
    body {background: #0f172a; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh;}
   .login-box {background: #1e293b; padding: 40px; border-radius: 10px; width: 300px;}
    input {width: 100%; padding: 10px; margin: 10px 0; background: #334155; border: none; color: white; border-radius: 5px;}
    button {width: 100%; padding: 10px; background: #38bdf8; border: none; color: black; font-weight: bold; border-radius: 5px; cursor: pointer;}
    h2 {text-align: center; color: #38bdf8;}
    </style>
</head>
<body>
    <div class="login-box">
        <h2> NOC Login</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        {% with messages = get_flashed_messages() %}
          {% if messages %}<p style="color:red">{{ messages[0] }}</p>{% endif %}
        {% endwith %}
    </div>
</body>
</html>
