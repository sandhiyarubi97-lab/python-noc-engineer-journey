<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NOC LOGIN</title>
    <style>
        body { background: black; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: #111; padding: 40px; border-radius: 10px; border: 2px solid green; text-align: center; }
        input { padding: 10px; margin: 10px; width: 250px; background: #222; color: white; border: 1px solid green; border-radius: 5px; }
        button { padding: 10px 20px; background: green; color: black; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        button:hover { background: lime; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔴 NOC LOGIN 🔴</h1>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">LOGIN</button>
        </form>
        <p style="font-size:12px; color:gray;">Default: admin / admin123</p>
    </div>
</body>
</html>
