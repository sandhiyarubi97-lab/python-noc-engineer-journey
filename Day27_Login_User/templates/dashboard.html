<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOC Dashboard</title>
    <style>
        body { font-family: Arial; background: #1a1a2e; color: white; margin: 0; padding: 20px; }
       .container { max-width: 800px; margin: auto; }
       .login-box { background: #16213e; padding: 30px; border-radius: 10px; text-align: center; margin-top: 100px; }
        input[type=password] { padding: 10px; width: 200px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #0f3460; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #e94560; }
       .device { background: #16213e; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; }
       .UP { color: #4ade80; font-weight: bold; }
       .DOWN { color: #f87171; font-weight: bold; }
       .header { display: flex; justify-content: space-between; align-items: center; }
       .error { color: #f87171; }
    </style>
    <script>
        // Auto refresh every 30 seconds
        setTimeout(function(){ location.reload(); }, 30000);
    </script>
</head>
<body>
    <div class="container">
        {% if show_login %}
            <div class="login-box">
                <h2>🔒 NOC Login</h2>
                {% if error %}<p class="error">{{ error }}</p>{% endif %}
                <!-- KEY FIX: action is /login not /dashboard -->
                <form action="/login" method="post">
                    <input type="password" name="password" placeholder="Enter Password" required>
                    <br><br>
                    <button type="submit">Login</button>
                </form>
            </div>
        {% else %}
            <div class="header">
                <h1>🚨 NOC Monitoring Dashboard</h1>
                <a href="/logout" style="color: #e94560;">Logout</a>
            </div>
            <p>Last Updated: {{ time }} | Auto-refresh: 30s</p>

            {% for name, status in devices.items() %}
            <div class="device">
                <span>{{ name }}</span>
                <span class="{{ status }}">{{ status }}</span>
            </div>
            {% endfor %}
        {% endif %}
    </div>
</body>
</html>
